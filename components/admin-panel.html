<!-- Modal de Contraseña -->
<div id="cms-auth-modal" class="cms-overlay" style="align-items: center; justify-content: center;">
  <div class="modal-content" style="background:var(--color-surface); padding:3rem; border:2px solid var(--lime); border-radius:20px; width:90%; max-width:400px; box-shadow:8px 8px 0px var(--lime);">
    <h3 class="modal-title" style="color:var(--lime); margin-bottom:0.5rem; font-family:var(--font-display); font-size:1.5rem;">Acceso Restringido</h3>
    <p style="margin-bottom:1.5rem;color:var(--text-secondary); font-size:0.9rem;">Panel de edición del portafolio.</p>
    <form id="cms-auth-form">
      <div class="form-group" style="margin-bottom:1.5rem;">
        <label for="cms-password" style="display:block; margin-bottom:0.5rem; color:var(--text-muted); text-transform:uppercase; font-size:0.8rem; font-weight:700;">Contraseña</label>
        <input type="password" id="cms-password" required placeholder="••••••••" style="width:100%; padding:0.8rem; background:var(--color-bg); border:1px solid rgba(255,255,255,0.2); color:#fff; outline:none; border-radius:12px;" />
      </div>
      <div class="modal-actions" style="display:flex; justify-content:flex-end; gap:1rem;">
        <button type="button" class="btn-text" id="btn-close-auth">Cancelar</button>
        <button type="submit" class="btn-primary" style="background:transparent; color:var(--lime); border:1px solid var(--lime); border-radius:9999px; padding:0.6rem 1.5rem;">Entrar</button>
      </div>
    </form>
  </div>
</div>

<!-- Dashboard CMS -->
<div id="cms-dashboard" class="cms-overlay">
  <div class="cms-sidebar">
    <h2>Panel CMS</h2>

    <!-- PillNav Tabs -->
    <div class="cms-pill-nav">
      <ul class="cms-pill-list">
        <li>
          <button class="cms-pill is-active" data-tab="tab-bio">
            <span class="cms-pill-hover-circle" aria-hidden="true"></span>
            <span class="cms-pill-label-stack">
              <span class="cms-pill-label">Biografía</span>
              <span class="cms-pill-label-hover" aria-hidden="true">Biografía</span>
            </span>
          </button>
        </li>
        <li>
          <button class="cms-pill" data-tab="tab-projects">
            <span class="cms-pill-hover-circle" aria-hidden="true"></span>
            <span class="cms-pill-label-stack">
              <span class="cms-pill-label">Proyectos</span>
              <span class="cms-pill-label-hover" aria-hidden="true">Proyectos</span>
            </span>
          </button>
        </li>
        <li>
          <button class="cms-pill" data-tab="tab-certs">
            <span class="cms-pill-hover-circle" aria-hidden="true"></span>
            <span class="cms-pill-label-stack">
              <span class="cms-pill-label">Certificados</span>
              <span class="cms-pill-label-hover" aria-hidden="true">Certificados</span>
            </span>
          </button>
        </li>
        <li>
          <button class="cms-pill" data-tab="tab-sesiones">
            <span class="cms-pill-hover-circle" aria-hidden="true"></span>
            <span class="cms-pill-label-stack">
              <span class="cms-pill-label">Bitácora</span>
              <span class="cms-pill-label-hover" aria-hidden="true">Bitácora</span>
            </span>
          </button>
        </li>
      </ul>
    </div>
    
    <div class="cms-sidebar-footer">
      <button id="btn-export-json" class="cms-pill-action" style="width:100%;">Exportar para Profesor</button>
      <button id="btn-close-dashboard" class="cms-pill-close">Cerrar Panel</button>
    </div>
  </div>

  <div class="cms-content">
    
    <!-- Tab: Bio -->
    <section id="tab-bio" class="cms-tab active">
      <h3>Editar Biografía</h3>
      <p style="margin-bottom:1rem; color:var(--text-secondary);">Edita tu texto principal. Los cambios se reflejarán en vivo al cerrar el panel.</p>
      <textarea id="cms-bio-text" rows="10" style="width:100%;background:rgba(255,255,255,0.05);color:#fff;padding:1rem;border:1px solid rgba(255,255,255,0.1);font-family:inherit; border-radius:12px; resize:vertical;"></textarea>
      <button id="btn-save-bio" class="cms-pill-action" style="margin-top:1rem;">Guardar Biografía</button>
    </section>

    <!-- Tab: Proyectos -->
    <section id="tab-projects" class="cms-tab">
      <h3>Proyectos Personales</h3>
      <div style="background:rgba(255,255,255,0.05);padding:1.5rem;border-radius:12px;margin-bottom:2rem;">
        <h4 style="margin-bottom:1rem;">Añadir desde GitHub</h4>
        <div style="display:flex;gap:1rem;">
          <input type="text" id="cms-github-url" placeholder="https://github.com/vasco140123/Repo..." style="flex:1;padding:0.7rem;background:rgba(255,255,255,0.05);color:#fff;border:1px solid rgba(255,255,255,0.1); border-radius:12px;" />
          <button id="btn-fetch-github" class="cms-pill-action">Extraer Info</button>
        </div>
        <p id="github-status" style="margin-top:0.5rem;font-size:0.85rem;color:var(--lime);"></p>
      </div>

      <div id="cms-projects-list" class="cms-list"></div>
    </section>

    <!-- Tab: Certificados -->
    <section id="tab-certs" class="cms-tab">
      <h3>Certificados</h3>
      <div style="background:rgba(255,255,255,0.05);padding:1.5rem;border-radius:12px;margin-bottom:2rem;">
        <h4 style="margin-bottom:1rem;">Nuevo Certificado</h4>
        <div class="form-group"><input type="text" id="cert-title" placeholder="Título del Certificado" /></div>
        <div class="form-group"><input type="text" id="cert-platform" placeholder="Plataforma (ej: Udemy)" /></div>
        <div class="form-group"><input type="text" id="cert-year" placeholder="Año" /></div>
        <div class="form-group"><input type="text" id="cert-desc" placeholder="Descripción corta (Opcional)" /></div>
        <div class="form-group"><input type="url" id="cert-url" placeholder="Enlace de la credencial en línea (Opcional)" /></div>
        <button id="btn-add-cert" class="cms-pill-action">Añadir Certificado</button>
      </div>
      
      <div id="cms-certs-list" class="cms-list"></div>
    </section>

    <!-- Tab: Sesiones -->
    <section id="tab-sesiones" class="cms-tab">
      <h3>Bitácora de Clases</h3>
      
      <div style="background:rgba(255,255,255,0.05);padding:1.5rem;border-radius:12px;margin-bottom:2rem;">
        <h4 style="margin-bottom:1rem;">Añadir Nueva Semana</h4>
        <div class="form-group"><input type="text" id="sesion-num" placeholder="Número de Semana (ej: 16)" /></div>
        <div class="form-group"><input type="text" id="sesion-tema" placeholder="Tema Principal" /></div>
        <div class="form-group"><input type="text" id="sesion-fecha" placeholder="Fecha (ej: 20 - 24 jul)" /></div>
        <div class="form-group"><input type="text" id="sesion-tags" placeholder="Herramientas separadas por coma" /></div>
        <button id="btn-add-sesion" class="cms-pill-action">Añadir Semana</button>
      </div>

      <div id="cms-sesiones-list" class="cms-list"></div>
    </section>

  </div>
</div>
